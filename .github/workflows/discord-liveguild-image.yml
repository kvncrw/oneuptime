# Fork-only (kvncrw/oneuptime): build the App image at this branch for the
# HOM-37 throwaway Railway env. Never intended for the upstream PR.
name: discord-liveguild-image
on:
  push:
    branches: [ci/discord-liveguild]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  app-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-gomplate
      - name: Generate Dockerfiles
        run: npm run prerun
        env:
          # Match what the local E2E snapshot build does.
          NO_COLOR: "1"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | bash ./Scripts/GHA/docker_login.sh --registry ghcr.io --username "${{ github.repository_owner }}"
      - name: Build and push App (community)
        run: |
          bash ./Scripts/GHA/build_docker_images.sh \
            --image app \
            --version "discord-liveguild" \
            --dockerfile ./packages/App/Dockerfile \
            --context . \
            --platforms linux/amd64 \
            --git-sha "${{ github.sha }}"
